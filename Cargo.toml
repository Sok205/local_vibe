[workspace]
resolver = "2"
members = [
    "crates/lv-core",
    "crates/lv-inference",
    "crates/lv-rag",
    "crates/lv-mcp",
    "crates/lv-tui",
    "crates/lv-cli",
    "crates/lv-metal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Filip Sokołowski"]
repository = "https://github.com/Sok205/local_vibe"
homepage = "https://github.com/Sok205/local_vibe"
readme = "README.md"
keywords = ["llm", "rag", "mcp", "semantic-search", "metal"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
nucleo-matcher = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
