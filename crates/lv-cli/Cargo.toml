[package]
name = "lv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalVibe CLI: index, search, chat, and serve a local AI stack"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "localvibe"
path = "src/main.rs"

# `lv` is kept as an alias for back-compat and convenience, even though
# the canonical binary is `localvibe` (avoids collision with the Linux
# LVM `lv` tool and the `lv` Japanese text viewer).
[[bin]]
name = "lv"
path = "src/main.rs"

[dependencies]
lv-core = { path = "../lv-core" }
lv-inference = { path = "../lv-inference" }
lv-rag = { path = "../lv-rag" }
lv-mcp = { path = "../lv-mcp" }
lv-metal = { path = "../lv-metal" }
lv-tui = { path = "../lv-tui" }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
